/*
 * Optional BungeeCord plugin: the BungeeCord counterpart of the Velocity plugin.
 * It embeds the master and balances players by backend tick time.
 */
plugins {
    id 'java'
}

repositories {
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}

dependencies {
    compileOnly 'net.md-5:bungeecord-api:1.20-R0.2'
    implementation project(':multiforge-master')
    implementation project(':multiforge-protocol')
}

tasks.named('jar', Jar).configure {
    dependsOn configurations.runtimeClasspath
    archiveBaseName = 'multiforge-bungee'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes(
                'Implementation-Title': 'MultiForge BungeeCord',
                'Implementation-Version': project.version
        )
    }
    from sourceSets.main.output
    from {
        configurations.runtimeClasspath.findAll { it.name.endsWith('.jar') }.collect { zipTree(it) }
    }
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'module-info.class'
}
