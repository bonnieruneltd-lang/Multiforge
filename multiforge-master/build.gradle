/*
 * MultiForge master module.
 *
 * The master is a standalone Netty process that coordinates every Forge server
 * in the cluster: it stores authoritative world data, arbitrates chunk/entity
 * ownership and relays chunk data between peers. It has no Minecraft or
 * Forge dependency, which makes it easy to run, test and scale separately.
 */
plugins {
    id 'application'
}

dependencies {
    implementation project(':multiforge-protocol')
    implementation 'org.apache.logging.log4j:log4j-api:2.20.0'
    runtimeOnly 'org.apache.logging.log4j:log4j-core:2.20.0'
    // Small, dependency free NBT library used to merge transient entity chunks.
    implementation 'se.llbit:jo-nbt:1.3.0'
    // Used by the master data storage (key/value YAML shared by all servers).
    implementation 'org.yaml:snakeyaml:1.33'
}

application {
    mainClass = 'com.multiforge.master.MultiForgeMaster'
    applicationDefaultJvmArgs = ['-Xmx1G']
}

tasks.named('jar') {
    manifest {
        attributes(
            'Main-Class': 'com.multiforge.master.MultiForgeMaster',
            'Implementation-Title': 'MultiForge Master',
            'Implementation-Version': project.version
        )
    }
}

// Produces a self contained master jar (master + protocol + Netty + logging).
tasks.register('fatJar', Jar) {
    dependsOn configurations.runtimeClasspath
    archiveClassifier = 'all'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest { attributes('Main-Class': 'com.multiforge.master.MultiForgeMaster') }
    from sourceSets.main.output
    from {
        configurations.runtimeClasspath.findAll { it.name.endsWith('.jar') }.collect { zipTree(it) }
    } exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'module-info.class'
}
